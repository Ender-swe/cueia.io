openapi: 3.0.3
info:
  title: Cueia workspace API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/providers:
    get:
      operationId: getProviders
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/session:
    post:
      operationId: exchangeSession
      security:
      - Clerk: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    delete:
      operationId: revokeSession
      security:
      - Cueia: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/workspace:
    get:
      operationId: getWorkspace
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/workspace/preferences:
    patch:
      operationId: updatePreferences
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /api/mail/threads:
    get:
      operationId: listThreads
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/calendar/events:
    get:
      operationId: listEvents
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/files:
    get:
      operationId: listFiles
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: directory
        in: query
        required: false
        schema:
          type: string
  /api/files/search:
    get:
      operationId: searchFiles
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
  /api/files/content:
    get:
      operationId: readFile
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
  /api/documents:
    post:
      operationId: registerDocument
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - fileId
                properties:
                  fileId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
  /api/documents/{fileId}/content:
    get:
      operationId: readDocument
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/documents/{fileId}/preview-links:
    post:
      operationId: issuePreview
      security:
      - Cueia: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/previews/{fileId}:
    get:
      operationId: redeemPreview
      security: []
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: true
        schema:
          type: string
components:
  securitySchemes:
    Cueia:
      type: http
      scheme: bearer
      bearerFormat: Opaque
    Clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    Session:
      type: object
      required:
      - token
      - expiresAt
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required:
      - fileId
      - filename
      properties:
        fileId:
          type: string
          format: uuid
        filename:
          type: string
    Event:
      type: object
      required:
      - id
      - title
      - startsAt
      - endsAt
      - timeZone
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timeZone:
          type: string
    Message:
      type: object
      required:
      - id
      - senderAddress
      - bodyText
      - sentAt
      - attachments
      properties:
        id:
          type: string
          format: uuid
        senderAddress:
          type: string
        bodyText:
          type: string
        sentAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    Thread:
      type: object
      required:
      - id
      - subject
      - messages
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    Preferences:
      type: object
      additionalProperties:
        type: string
    Workspace:
      type: object
      required:
      - id
      - threads
      - events
      - preferences
      properties:
        id:
          type: string
          format: uuid
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        preferences:
          $ref: '#/components/schemas/Preferences'
    Entry:
      type: object
      required:
      - path
      - name
      - kind
      properties:
        path:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - file
          - directory
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    Provider:
      type: object
      required:
      - name
      - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - disabled
          - configured
          - unavailable
    Preview:
      type: object
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
